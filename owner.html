<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Eksklusif</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --text-main: #111827; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; }

        .header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .header h1 { font-size: 20px; color: #111; letter-spacing: -0.5px;}

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: #fff; border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; border: 1px solid #f0f0f0; display: flex; flex-direction: column;}
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-img-wrapper { position: relative; width: 100%; padding-top: 100%; }
        .card-img-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column;}
        .card-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .card-price { font-size: 16px; font-weight: 700; margin-top: auto;}

        /* STYLING STATUS BARANG */
        .card.out-of-stock { opacity: 0.6; filter: grayscale(80%); pointer-events: none; } 
        
        .badge { position: absolute; top: 10px; right: 10px; color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; z-index: 2; }
        .badge-habis { background: #dc2626; } 
        .badge-presale { background: #d97706; } 
        .badge-banyak-foto { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: white; padding: 4px 8px; border-radius: 6px; font-size: 10px; z-index: 2;}

        .status-text { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #666; font-size: 14px; }

        /* Modal Popup */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0, 0.6); backdrop-filter: blur(2px); z-index: 1000; align-items: flex-end; justify-content: center; animation: fadeIn 0.3s; }
        .modal-content { background: #fff; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: slideUp 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* Area Slider / Gambar Banyak */
        .modal-header-img { position: relative; width: 100%; aspect-ratio: 1/1; background: #f9f9f9; border-radius: 24px 24px 0 0; overflow: hidden; }
        .image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 100%; width: 100%; }
        .image-slider::-webkit-scrollbar { display: none; }
        .image-slider img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; }
        
        .swipe-hint { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: white; padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; z-index: 10; pointer-events: none;}
        .btn-close { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.9); width: 36px; height: 36px; border-radius: 50%; border: none; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; }
        
        .modal-body { padding: 24px; padding-bottom: 100px; overflow-y: auto;}
        .modal-price { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 20px; }
        .modal-desc { font-size: 14px; color: #555; white-space: pre-line; line-height: 1.6; }
        
        .modal-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 20px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: center; }
        .btn-buy { width: 100%; max-width: 400px; background: #111; color: #fff; padding: 16px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

    <header class="header">
        <h1>Katalog Produk</h1>
    </header>

    <main class="grid-container" id="katalog-container">
        <div class="status-text">Memuat produk... ⏳</div>
    </main>

    <!-- Modal Produk -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <div class="modal-header-img">
                <button class="btn-close" onclick="closeModal()">&times;</button>
                <!-- Kontainer Slider Gambar -->
                <div class="image-slider" id="modal-slider">
                    <!-- Gambar akan dimunculkan di sini -->
                </div>
                <div id="swipe-hint" class="swipe-hint">Geser foto ↔️</div>
            </div>
            <div class="modal-body">
                <div class="modal-price" id="modal-price"></div>
                <div class="modal-title" id="modal-title"></div>
                <div style="font-size:12px; font-weight:600; color:#888; margin-bottom:8px;">DESKRIPSI</div>
                <div class="modal-desc" id="modal-desc"></div>
            </div>
            <div class="modal-footer">
                <a href="#" id="modal-buy-btn" class="btn-buy" target="_blank">Pesan via WhatsApp</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwiWOMfOnoa1pjnVm9UefBhlGSH0mppuip16ui1H01W1Hixd4XwJRP-vZ36fl4-iFc9vw/exec';
        const NOMOR_WA = "6281360171337"; 

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);

        async function fetchProduk() {
            const container = document.getElementById('katalog-container');
            try {
                const res = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const data = await res.json();
                container.innerHTML = ''; 
                if (!data || data.length === 0) return container.innerHTML = '<div class="status-text">Katalog kosong.</div>';

                data.reverse().forEach(produk => {
                    const hrg = formatRupiah(produk.price);
                    // Pisahkan semua gambar menggunakan pemisah |
                    let images = produk.image ? produk.image.split('|').map(url => url.trim()) : [];
                    let thumb = images[0] ? images[0] : ""; 
                    let isMultiple = images.length > 1; // Cek apakah foto lebih dari 1
                    
                    const isHabis = produk.status === "Kosong";
                    const isPresale = produk.status === "Presale";

                    let badgeHtml = '';
                    if (isHabis) { badgeHtml = '<div class="badge badge-habis">STOK HABIS</div>'; } 
                    else if (isPresale) { badgeHtml = '<div class="badge badge-presale">PRESALE</div>'; }

                    const card = document.createElement('div');
                    card.className = `card ${isHabis ? 'out-of-stock' : ''}`;
                    
                    card.innerHTML = `
                        ${badgeHtml}
                        <div class="card-img-wrapper">
                            <img src="${thumb}">
                            ${isMultiple ? '<div class="badge-banyak-foto">Ada ' + images.length + ' Foto</div>' : ''}
                        </div>
                        <div class="card-content">
                            <div class="card-title">${produk.name}</div>
                            <div class="card-price">${hrg}</div>
                        </div>
                    `;

                    if(!isHabis) {
                        // Kirimkan array gambar lengkap (bukan cuma thumb) ke fungsi openModal
                        card.addEventListener('click', () => openModal(produk, hrg, images, isPresale));
                    }
                    container.appendChild(card);
                });
            } catch (error) { container.innerHTML = '<div class="status-text" style="color:red;">Koneksi terputus.</div>'; }
        }

        const modal = document.getElementById('product-modal');
        
        function openModal(produk, hrg, images, isPresale) {
            // Render semua foto ke dalam slider
            let sliderHtml = '';
            images.forEach(imgSrc => {
                if(imgSrc) sliderHtml += `<img src="${imgSrc}" onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=Error'">`;
            });
            document.getElementById('modal-slider').innerHTML = sliderHtml;
            
            // Tampilkan/Sembunyikan hint "Geser foto" jika foto cuma 1
            document.getElementById('swipe-hint').style.display = images.length > 1 ? 'block' : 'none';

            document.getElementById('modal-title').innerText = produk.name;
            document.getElementById('modal-price').innerText = hrg;
            document.getElementById('modal-desc').innerText = produk.desc;
            
            let textWA = '';
            if(isPresale) {
                textWA = `Halo, saya tertarik untuk ikut PRE-ORDER / PRESALE:\n\n*${produk.name}*\nHarga: ${hrg}\n\nBagaimana sistem PO-nya?`;
            } else {
                textWA = `Halo, saya mau pesan:\n\n*${produk.name}*\nHarga: ${hrg}`;
            }

            document.getElementById('modal-buy-btn').href = `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(textWA)}`;
            modal.style.display = 'flex';
        }

        function closeModal() { modal.style.display = 'none'; }
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

        fetchProduk();
    </script>
</body>
</html>
