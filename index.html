<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Owner Dashboard - Firebase Turbo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-body: #f7f7f8; --bg-card: #ffffff; --text-main: #111111; --text-muted: #666666; --border: #e5e5e5; --accent: #111111; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--bg-card); padding: 35px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.02); }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #f0f0f0; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade 0.3s; }
        @keyframes fade { from {opacity: 0;} to {opacity: 1;} }

        .input-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(17,17,17,0.05); }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        
        .stock-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; gap: 10px;}
        .item-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .item-img-container { position: relative; width: 55px; height: 55px; border-radius: 8px; background: #eee; overflow: hidden; flex-shrink: 0;}
        .item-img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        
        .btn-group-action { display: flex; gap: 6px; }
        .btn-edit, .btn-delete { border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-edit { background: #f0f0f0; color: #444; } .btn-edit:hover { background: #e5e5e5; }
        .btn-delete { background: #fee2e2; color: #991b1b; } .btn-delete:hover { background: #fecaca; }

        .status-controls { display: flex; flex-direction: column; gap: 4px; }
        .btn-status { padding: 6px 12px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #fff; color: #666; transition: 0.2s;}
        .btn-status.active-Ready { background: #ffffff; color: #111; border-color: #111; }
        .btn-status.active-Presale { background: #fef08a; color: #854d0e; border-color: #854d0e; }
        .btn-status.active-Kosong { background: #dcfce7; color: #166534; border-color: #166534; } 

        .btn-migrate { background: #fef08a; color: #854d0e; border: 1px solid #eab308; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; margin-bottom: 20px; cursor: pointer;}

        .skeleton-img, .skeleton-text { background: #e5e5e5; position: relative; overflow: hidden; border-radius: 4px; }
        .shimmer::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0)); animation: shimmer 1.5s infinite; }
        
        #toast { visibility: hidden; min-width: 250px; background: #111; color: #fff; text-align: center; border-radius: 8px; padding: 14px; position: fixed; bottom: 40px; transform: translateX(-50%); left: 50%; z-index: 1000;}
        #toast.show { visibility: visible; }
        
        .modal-edit { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px;}
        .modal-edit-box { background: #fff; padding: 25px; border-radius: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;}
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px;}
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;}
        .btn-cancel { background: #f0f0f0; color: #333; } .btn-update { background: #111; color: #fff; }
        
        .total-badge { background: #111; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 15px;}

        /* CSS KHUSUS CONTAINER EDIT FOTO */
        .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .preview-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; background: #f0f0f0; }
        .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-img { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Katalog Manajemen ⚡</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upload', this)">Tambah Produk</button>
            <button class="tab-btn" onclick="switchTab('stock', this); loadStock();">Kelola Stok</button>
        </div>

        <div id="tab-upload" class="tab-content active">
            <form id="formProduk">
                <div class="input-group">
                    <label>Nama Produk</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Harga</label>
                    <input type="text" id="price" required>
                </div>
                <div class="input-group">
                    <label>Foto Produk (Pilih > 1)</label>
                    <input type="file" id="imageFiles" accept="image/png, image/jpeg, image/webp" multiple required>
                </div>
                <div class="input-group">
                    <label>Deskripsi</label>
                    <textarea id="desc" rows="3" required></textarea>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Upload Cepat 🚀</button>
            </form>
        </div>

        <div id="tab-stock" class="tab-content">
            <button class="btn-migrate" id="btn-migrate" onclick="migrasiDataLama()">📥 Tarik Data Lama dari Google Sheets</button>
            <div id="total-stock-container"></div>
            <div id="stock-list"></div>
        </div>
    </div>

    <!-- MODAL EDIT INTERAKTIF -->
    <div class="modal-edit" id="modal-edit">
        <div class="modal-edit-box">
            <h3 style="margin-bottom: 20px;">Edit Produk</h3>
            <div class="input-group"><label>Nama Produk</label><input type="text" id="editName" required></div>
            <div class="input-group"><label>Harga</label><input type="text" id="editPrice" required></div>
            <div class="input-group"><label>Deskripsi</label><textarea id="editDesc" rows="3" required></textarea></div>
            
            <div class="input-group">
                <label>Foto Saat Ini (Klik × untuk hapus)</label>
                <div class="preview-grid" id="edit-image-preview"></div>
            </div>

            <div class="input-group">
                <label>Tambah Foto Baru (+)</label>
                <input type="file" id="editImageFiles" accept="image/png, image/jpeg, image/webp" multiple>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
                <button class="btn-update" id="btn-submit-edit" onclick="submitEditProduk()">Simpan Edit</button>
            </div>
        </div>
    </div>

    <div id="toast">Notifikasi</div>

    <script>
        firebase.initializeApp({
          apiKey: "AIzaSyBZgM4UhREna78QDErqZRoQAxQJOV2or-g",
          authDomain: "katalogpindahan.firebaseapp.com",
          projectId: "katalogpindahan",
          storageBucket: "katalogpindahan.firebasestorage.app",
          messagingSenderId: "669980037618",
          appId: "1:669980037618:web:f8edfb7d9769390bb61b6b",
          measurementId: "G-VE15CDCC0Y"
        });
        const db = firebase.firestore();
        const IMGBB_API_KEY = '9936bb39d0e369af97d393b546823709'; 
        
        let currentEditId = null;
        let currentEditingImages = []; // Menyimpan list gambar aktif saat mode edit

        document.getElementById('price').addEventListener('input', formatRupiahInput);
        document.getElementById('editPrice').addEventListener('input', formatRupiahInput);

        function formatRupiahInput(e) {
            let value = this.value.replace(/[^0-9]/g, ''); 
            if (value) { this.value = 'Rp ' + new Intl.NumberFormat('id-ID').format(value); } else { this.value = ''; }
        }

        function switchTab(tab, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active'); 
            if(btnElement) btnElement.classList.add('active');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById("toast"); toast.innerText = msg; 
            toast.style.background = isError ? "#dc2626" : "#111"; toast.className = "show"; setTimeout(() => toast.className = "", 3000);
        }

        async function uploadToImgBB(file) {
            const formData = new FormData(); formData.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) return data.data.url; 
            throw new Error("Gagal upload ke ImgBB");
        }

        async function migrasiDataLama() {
            if(!confirm("Yakin ingin memindahkan data dari Google Sheets ke Firebase?")) return;
            const btnMigrate = document.getElementById('btn-migrate'); btnMigrate.innerText = "Menyedot Data... ⏳"; btnMigrate.disabled = true;
            try {
                const API_LAMA = 'https://script.google.com/macros/s/AKfycbwiWOMfOnoa1pjnVm9UefBhlGSH0mppuip16ui1H01W1Hixd4XwJRP-vZ36fl4-iFc9vw/exec';
                const res = await fetch(`${API_LAMA}?t=${new Date().getTime()}`); const dataLama = await res.json();
                for(let i = 0; i < dataLama.length; i++) {
                    let p = dataLama[i];
                    await db.collection("products").doc(p.id.toString()).set({
                        name: p.name, price: p.price, desc: p.desc, image: p.image, status: p.status, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                showToast("✅ Migrasi Berhasil!"); btnMigrate.style.display = "none"; loadStock();
            } catch(e) {
                showToast("Gagal migrasi: " + e.message, true); btnMigrate.innerText = "Coba Lagi Migrasi"; btnMigrate.disabled = false;
            }
        }
        
        document.getElementById('formProduk').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.innerText = 'Uploading... 🚀'; btn.disabled = true;
            try {
                const rawPrice = document.getElementById('price').value.replace(/[^0-9]/g, ''); const fileInput = document.getElementById('imageFiles');
                let imgUrls = await Promise.all(Array.from(fileInput.files).map(f => uploadToImgBB(f)));
                await db.collection("products").add({ name: document.getElementById('name').value, price: rawPrice, desc: document.getElementById('desc').value, image: imgUrls.join('|'), status: 'Ready', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                showToast('✅ Produk ditambahkan!'); document.getElementById('formProduk').reset();
            } catch (error) { showToast(error.message, true); } finally { btn.innerText = 'Upload Cepat 🚀'; btn.disabled = false; }
        });

        async function loadStock() {
            const list = document.getElementById('stock-list'); const totalContainer = document.getElementById('total-stock-container');
            list.innerHTML = '<div style="text-align:center;">Memuat data kilat... ⚡</div>'; totalContainer.innerHTML = '';
            
            try {
                const snapshot = await db.collection("products").orderBy("createdAt", "desc").get();
                if(snapshot.empty) { list.innerHTML = '<p style="text-align:center;">Belum ada produk di Firebase.</p>'; return; }
                document.getElementById('btn-migrate').style.display = 'none';
                
                let readyCount = 0; let soldCount = 0; let presaleCount = 0; let productsHTML = '';

                snapshot.forEach(doc => {
                    const p = doc.data(); const id = doc.id;
                    if (p.status === 'Ready') readyCount++;
                    else if (p.status === 'Kosong') soldCount++;
                    else if (p.status === 'Presale') presaleCount++;

                    let fileIds = p.image ? p.image.split('|') : []; let firstId = fileIds[0] || '';
                    let thumbUrl = firstId.startsWith('http') ? firstId : (firstId ? `https://drive.google.com/thumbnail?id=${firstId}&sz=w200` : '');
                    
                    let encodedImages = encodeURIComponent(p.image || '');

                    productsHTML += `
                        <div class="stock-item">
                            <div class="item-info">
                                <div class="item-img-container"><img src="${thumbUrl}" class="item-img" loading="lazy"></div>
                                <div>
                                    <div class="item-title">${p.name}</div>
                                    <div class="btn-group-action">
                                        <button class="btn-edit" onclick="openEditModal('${id}', '${p.name.replace(/'/g, "\\'")}', '${p.price}', '${encodeURIComponent(p.desc)}', '${encodedImages}')">✏️ Edit</button>
                                        <button class="btn-delete" onclick="deleteProduk('${id}', '${p.name.replace(/'/g, "\\'")}')">🗑️ Hapus</button>
                                    </div>
                                </div>
                            </div>
                            <div class="status-controls">
                                <button class="btn-status ${p.status === 'Ready' ? 'active-Ready' : ''}" onclick="updateStock('${id}', 'Ready', this)">Tersedia</button>
                                <button class="btn-status ${p.status === 'Presale' ? 'active-Presale' : ''}" onclick="updateStock('${id}', 'Presale', this)">Presale</button>
                                <button class="btn-status ${p.status === 'Kosong' ? 'active-Kosong' : ''}" onclick="updateStock('${id}', 'Kosong', this)">Terjual</button>
                            </div>
                        </div>
                    `;
                });

                totalContainer.innerHTML = `
                    <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
                        <div class="total-badge" style="margin-bottom: 0;">📦 Total: ${snapshot.size}</div>
                        <div class="total-badge" style="background: #ffffff; color: #111; border: 1px solid #e5e5e5; margin-bottom: 0;">Tersedia: ${readyCount}</div>
                        ${presaleCount > 0 ? `<div class="total-badge" style="background: #854d0e; margin-bottom: 0;">⏳ Pre-sale: ${presaleCount}</div>` : ''}
                        <div class="total-badge" style="background: #166534; margin-bottom: 0;">✅ Terjual: ${soldCount}</div>
                    </div>
                `;
                list.innerHTML = productsHTML;

            } catch (e) { list.innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>'; }
        }

        async function updateStock(id, newStatus, btnElement) {
            const container = btnElement.parentElement; const buttons = container.querySelectorAll('.btn-status');
            buttons.forEach(b => { b.classList.remove('active-Ready', 'active-Presale', 'active-Kosong'); b.disabled = true; });
            btnElement.classList.add('active-' + newStatus); btnElement.innerText = '...';
            try {
                await db.collection("products").doc(id).update({ status: newStatus }); 
                showToast(`✅ Status Tersimpan`); loadStock();
            } catch (e) { showToast(`❌ Gagal!`, true); } 
            finally { 
                buttons.forEach(b => b.disabled = false); 
                if (newStatus === 'Kosong') btnElement.innerText = 'Terjual ✅';
                else if (newStatus === 'Ready') btnElement.innerText = 'Tersedia';
                else btnElement.innerText = newStatus;
            }
        }

        async function deleteProduk(id, name) {
            if(!confirm(`YAKIN INGIN MENGHAPUS "${name}"?`)) return; showToast("Sedang menghapus...");
            try { await db.collection("products").doc(id).delete(); showToast('✅ Dihapus!'); loadStock(); } catch (error) { showToast('Gagal hapus.', true); }
        }

        // BUKA MODAL EDIT DAN RENDER HISTORI FOTO
        function openEditModal(id, name, price, descEncoded, imagesEncoded) {
            currentEditId = id; 
            document.getElementById('editName').value = name; 
            document.getElementById('editPrice').value = 'Rp ' + new Intl.NumberFormat('id-ID').format(price);
            document.getElementById('editDesc').value = decodeURIComponent(descEncoded);
            document.getElementById('editImageFiles').value = ''; 

            let rawImages = decodeURIComponent(imagesEncoded);
            currentEditingImages = rawImages ? rawImages.split('|').map(u => u.trim()).filter(u => u !== '') : [];

            renderImagePreviews();
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function renderImagePreviews() {
            const previewContainer = document.getElementById('edit-image-preview');
            previewContainer.innerHTML = '';

            if (currentEditingImages.length === 0) {
                previewContainer.innerHTML = '<span style="font-size: 12px; color: #999;">Tidak ada foto. Harap tambah foto baru.</span>';
                return;
            }

            currentEditingImages.forEach((url, index) => {
                let thumbUrl = url.startsWith('http') ? url : `https://drive.google.com/thumbnail?id=${url}&sz=w200`;
                previewContainer.innerHTML += `
                    <div class="preview-thumb">
                        <img src="${thumbUrl}">
                        <button type="button" class="btn-remove-img" onclick="removeEditingImage(${index})">×</button>
                    </div>
                `;
            });
        }

        function removeEditingImage(index) {
            currentEditingImages.splice(index, 1);
            renderImagePreviews();
        }

        function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; currentEditId = null; }

        async function submitEditProduk() {
            const editName = document.getElementById('editName').value; 
            const editPrice = document.getElementById('editPrice').value.replace(/[^0-9]/g, '');
            const editDesc = document.getElementById('editDesc').value; 
            const fileInput = document.getElementById('editImageFiles');
            const btn = document.getElementById('btn-submit-edit'); 
            
            if (!editName || !editPrice || !editDesc) { alert("Data teks wajib diisi!"); return; }
            if (currentEditingImages.length === 0 && fileInput.files.length === 0) { alert("Produk harus memiliki minimal 1 foto!"); return; }

            btn.innerText = 'Menyimpan... ⏳'; btn.disabled = true;
            try {
                // Upload foto baru jika ada yang dipilih di input file (+)
                let newUploadedUrls = [];
                if (fileInput.files.length > 0) {
                    newUploadedUrls = await Promise.all(Array.from(fileInput.files).map(f => uploadToImgBB(f)));
                }

                // Gabungkan histori foto lama yang tersisa + foto baru
                let finalImages = [...currentEditingImages, ...newUploadedUrls];

                let updates = { 
                    name: editName, 
                    price: editPrice, 
                    desc: editDesc,
                    image: finalImages.join('|')
                };

                await db.collection("products").doc(currentEditId).update(updates);
                showToast('✅ Produk Berhasil Diubah!'); 
                closeEditModal(); 
                loadStock(); 
            } catch (error) { 
                showToast("Gagal menyimpan perubahan", true); 
            } finally { 
                btn.innerText = 'Simpan Edit'; 
                btn.disabled = false; 
            }
        }
    </script>
</body>
</html>
