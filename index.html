<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Pro Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-body: #f7f7f8; --bg-card: #ffffff; --text-main: #111111; --text-muted: #666666; --border: #e5e5e5; --accent: #111111; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--bg-card); padding: 35px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.02); }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #f0f0f0; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade 0.3s; }
        @keyframes fade { from {opacity: 0;} to {opacity: 1;} }

        .input-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(17,17,17,0.05); }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-submit:disabled { background: #666; cursor: not-allowed; }
        
        /* SEARCH BAR KELOLA STOK */
        .search-box-owner { position: relative; margin-bottom: 15px; }
        .search-box-owner input { padding-left: 42px; border-radius: 12px; background: #f9f9f9;}
        .search-box-owner input:focus { background: #fff; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; pointer-events: none;}

        .stock-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; gap: 10px; background: #fff;}
        .item-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .item-img-container { position: relative; width: 55px; height: 55px; border-radius: 8px; background: #eee; overflow: hidden; flex-shrink: 0;}
        .item-img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        
        .btn-group-action { display: flex; gap: 6px; }
        .btn-edit, .btn-delete { border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-edit { background: #f0f0f0; color: #444; } .btn-edit:hover { background: #e5e5e5; }
        .btn-delete { background: #fee2e2; color: #991b1b; } .btn-delete:hover { background: #fecaca; }

        .status-controls { display: flex; flex-direction: column; gap: 4px; }
        .btn-status { padding: 6px 12px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #fff; color: #666; transition: 0.2s;}
        .btn-status.active-Ready { background: #ffffff; color: #111; border-color: #111; }
        .btn-status.active-Presale { background: #fef08a; color: #854d0e; border-color: #854d0e; }
        .btn-status.active-Kosong { background: #dcfce7; color: #166534; border-color: #166534; } 

        /* CSS UNTUK FILTER LENCANA INTERAKTIF */
        .total-badge { padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; cursor: pointer; transition: all 0.2s ease; opacity: 0.45; border-width: 1px; border-style: solid;}
        .total-badge:hover { opacity: 0.7; transform: translateY(-1px); }
        .total-badge.active-filter { opacity: 1; font-weight: 700; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        
        /* CSS UNTUK MODAL EDIT & PREVIEW GAMBAR */
        .modal-edit { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px;}
        .modal-edit-box { background: #fff; padding: 25px; border-radius: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;}
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px;}
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;}
        .btn-cancel { background: #f0f0f0; color: #333; } .btn-update { background: #111; color: #fff; }
        
        .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .preview-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; background: #f0f0f0; }
        .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-img { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.8); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #toast { visibility: hidden; min-width: 250px; background: #111; color: #fff; text-align: center; border-radius: 8px; padding: 14px; position: fixed; bottom: 40px; transform: translateX(-50%); left: 50%; z-index: 3000; font-weight: 500;}
        #toast.show { visibility: visible; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Katalog Manajemen ⚡</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upload', this)">Tambah Produk</button>
            <button class="tab-btn" onclick="switchTab('stock', this); loadStock();">Kelola Stok</button>
        </div>

        <div id="tab-upload" class="tab-content active">
            <form id="formProduk">
                <div class="input-group">
                    <label>Nama Produk</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Harga</label>
                    <input type="text" id="price" required>
                </div>
                <div class="input-group">
                    <label>Pilih Gambar (Otomatis masuk ke Google Drive)</label>
                    <input type="file" id="imageFiles" accept="image/png, image/jpeg, image/webp" multiple required>
                </div>
                <div class="input-group">
                    <label>Deskripsi</label>
                    <textarea id="desc" rows="3" required></textarea>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Upload dan Simpan</button>
            </form>
        </div>

        <div id="tab-stock" class="tab-content">
            <!-- PENCARIAN STOK -->
            <div class="search-box-owner">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchStockInput" placeholder="Cari nama barang..." oninput="renderStock()">
            </div>
            
            <!-- WADAH LENCANA FILTER -->
            <div id="total-stock-container"></div>
            
            <!-- DAFTAR BARANG -->
            <div id="stock-list"></div>
        </div>
    </div>

    <!-- MODAL EDIT PRODUK -->
    <div class="modal-edit" id="modal-edit">
        <div class="modal-edit-box">
            <h3 style="margin-bottom: 20px;">Edit Produk</h3>
            <div class="input-group"><label>Nama Produk</label><input type="text" id="editName" required></div>
            <div class="input-group"><label>Harga</label><input type="text" id="editPrice" required></div>
            <div class="input-group"><label>Deskripsi</label><textarea id="editDesc" rows="3" required></textarea></div>
            
            <div class="input-group">
                <label>Foto Saat Ini (Klik × untuk hapus)</label>
                <div class="preview-grid" id="edit-image-preview"></div>
            </div>

            <div class="input-group">
                <label>Tambah Foto Baru (+) Opsional</label>
                <input type="file" id="editImageFiles" accept="image/png, image/jpeg, image/webp" multiple>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
                <button class="btn-update" id="btn-submit-edit" onclick="submitEditProduk()">Simpan Edit 🚀</button>
            </div>
        </div>
    </div>

    <div id="toast">Notifikasi</div>

    <script>
        firebase.initializeApp({
          apiKey: "AIzaSyBZgM4UhREna78QDErqZRoQAxQJOV2or-g",
          authDomain: "katalogpindahan.firebaseapp.com",
          projectId: "katalogpindahan",
          storageBucket: "katalogpindahan.firebasestorage.app",
          messagingSenderId: "669980037618",
          appId: "1:669980037618:web:f8edfb7d9769390bb61b6b"
        });
        const db = firebase.firestore();

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiWOMfOnoa1pjnVm9UefBhlGSH0mppuip16ui1H01W1Hixd4XwJRP-vZ36fl4-iFc9vw/exec';
        
        let currentEditId = null;
        let currentEditingImages = []; 
        
        // VARIABEL LOKAL UNTUK PENCARIAN & FILTER REAL-TIME
        let localProducts = [];
        let currentFilter = 'All';

        document.getElementById('price').addEventListener('input', formatRupiahInput);
        document.getElementById('editPrice').addEventListener('input', formatRupiahInput);

        function formatRupiahInput(e) {
            let value = this.value.replace(/[^0-9]/g, ''); 
            if (value) { this.value = 'Rp ' + new Intl.NumberFormat('id-ID').format(value); } else { this.value = ''; }
        }

        function switchTab(tab, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active'); 
            if(btnElement) btnElement.classList.add('active');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById("toast"); toast.innerText = msg; 
            toast.style.background = isError ? "#dc2626" : "#111"; toast.className = "show"; setTimeout(() => toast.className = "", 3000);
        }

        async function uploadFileToDrive(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    const base64Data = reader.result.split(',')[1];
                    try {
                        const response = await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ fileName: file.name, mimeType: file.type, base64: base64Data })
                        });
                        const result = await response.json();
                        if (result.status === 'success') resolve(result.id); 
                        else reject(result.message);
                    } catch (e) { reject("Koneksi gagal ke Google Script"); }
                };
                reader.readAsDataURL(file);
            });
        }
        
        document.getElementById('formProduk').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const btn = document.getElementById('btn-submit'); 
            btn.innerText = 'Mengirim File ke Google Drive... ⏳'; btn.disabled = true;

            try {
                const rawPrice = document.getElementById('price').value.replace(/[^0-9]/g, ''); 
                const fileInput = document.getElementById('imageFiles');
                let driveIds = await Promise.all(Array.from(fileInput.files).map(f => uploadFileToDrive(f)));

                await db.collection("products").add({ 
                    name: document.getElementById('name').value, 
                    price: rawPrice, 
                    desc: document.getElementById('desc').value, 
                    image: driveIds.join('|'), 
                    status: 'Ready', 
                    createdAt: firebase.firestore.FieldValue.serverTimestamp() 
                });
                
                showToast('✅ Produk Berhasil Disimpan!'); 
                document.getElementById('formProduk').reset();
            } catch (error) { 
                showToast("Gagal: " + error, true); 
            } finally { 
                btn.innerText = 'Upload ke Drive & Simpan 🚀'; btn.disabled = false; 
            }
        });

        // ==========================================
        // SISTEM LOAD, RENDER & FILTER (ANTI-LOMPAT)
        // ==========================================

        // Mengambil data dari Firebase HANYA sekali saat tab ditekan
        async function loadStock() {
            const list = document.getElementById('stock-list'); 
            const totalContainer = document.getElementById('total-stock-container');
            
            list.innerHTML = '<div style="text-align:center; padding: 20px;">Memuat data dari server... ⚡</div>';
            totalContainer.innerHTML = '';
            
            try {
                const snapshot = await db.collection("products").orderBy("createdAt", "desc").get();
                localProducts = []; // Kosongkan data lokal
                
                if(snapshot.empty) { 
                    list.innerHTML = '<p style="text-align:center;">Belum ada produk.</p>'; 
                    return; 
                }
                
                // Simpan ke variabel lokal agar cepat saat filter/pencarian
                snapshot.forEach(doc => {
                    localProducts.push({ id: doc.id, ...doc.data() });
                });

                renderStock(); // Jalankan fungsi render
            } catch (e) { list.innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>'; }
        }

        // Fungsi khusus saat Lencana diklik
        function setFilter(status) {
            currentFilter = status;
            renderStock();
        }

        // Fungsi khusus menampilkan data & lencana secara instan
        function renderStock() {
            const list = document.getElementById('stock-list'); 
            const totalContainer = document.getElementById('total-stock-container');
            const searchQuery = document.getElementById('searchStockInput').value.toLowerCase().trim();
            
            let readyCount = 0; let soldCount = 0; let presaleCount = 0;
            
            // Hitung total murni dari seluruh data
            localProducts.forEach(p => {
                if (p.status === 'Ready') readyCount++;
                else if (p.status === 'Kosong') soldCount++;
                else if (p.status === 'Presale') presaleCount++;
            });

            // TAMPILKAN LENCANA FILTER (INTERAKTIF)
            totalContainer.innerHTML = `
                <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div class="total-badge ${currentFilter === 'All' ? 'active-filter' : ''}" onclick="setFilter('All')" style="background: #111; color: #fff; border-color: #111;">📦 Total: ${localProducts.length}</div>
                    <div class="total-badge ${currentFilter === 'Ready' ? 'active-filter' : ''}" onclick="setFilter('Ready')" style="background: #ffffff; color: #111; border-color: #e5e5e5;">Tersedia: ${readyCount}</div>
                    <div class="total-badge ${currentFilter === 'Presale' ? 'active-filter' : ''}" onclick="setFilter('Presale')" style="background: #854d0e; color: #fff; border-color: #854d0e;">⏳ Pre-sale: ${presaleCount}</div>
                    <div class="total-badge ${currentFilter === 'Kosong' ? 'active-filter' : ''}" onclick="setFilter('Kosong')" style="background: #166534; color: #fff; border-color: #166534;">✅ Terjual: ${soldCount}</div>
                </div>
            `;
            
            // Filter data berdasarkan Pencarian (Search Bar) DAN Lencana
            let filteredProducts = localProducts.filter(p => {
                let matchSearch = p.name.toLowerCase().includes(searchQuery);
                let matchStatus = currentFilter === 'All' ? true : p.status === currentFilter;
                return matchSearch && matchStatus;
            });

            if (filteredProducts.length === 0) {
                list.innerHTML = '<p style="text-align:center; margin-top:20px; color:#888;">Produk tidak ditemukan.</p>';
                return;
            }

            let productsHTML = '';
            filteredProducts.forEach(p => {
                let fileIds = p.image ? p.image.split('|') : []; let firstId = fileIds[0] || '';
                let thumbUrl = `https://drive.google.com/thumbnail?id=${firstId}&sz=w200`;
                let encodedImages = encodeURIComponent(p.image || '');

                productsHTML += `
                    <div class="stock-item">
                        <div class="item-info">
                            <div class="item-img-container">
                                <img src="${thumbUrl}" class="item-img" onerror="this.src='https://placehold.co/200x200/eeeeee/999999?text=Gagal';">
                            </div>
                            <div>
                                <div class="item-title">${p.name}</div>
                                <div class="btn-group-action">
                                    <button class="btn-edit" onclick="openEditModal('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.price}', '${encodeURIComponent(p.desc)}', '${encodedImages}')">✏️ Edit</button>
                                    <button class="btn-delete" onclick="deleteProduk('${p.id}', '${p.name.replace(/'/g, "\\'")}')">🗑️ Hapus</button>
                                </div>
                            </div>
                        </div>
                        <div class="status-controls">
                            <button class="btn-status ${p.status === 'Ready' ? 'active-Ready' : ''}" onclick="updateStock('${p.id}', 'Ready', this)">Tersedia</button>
                            <button class="btn-status ${p.status === 'Presale' ? 'active-Presale' : ''}" onclick="updateStock('${p.id}', 'Presale', this)">Presale</button>
                            <button class="btn-status ${p.status === 'Kosong' ? 'active-Kosong' : ''}" onclick="updateStock('${p.id}', 'Kosong', this)">Terjual ✅</button>
                        </div>
                    </div>
                `;
            });
            
            list.innerHTML = productsHTML;
        }

        async function updateStock(id, newStatus, btnElement) {
            const container = btnElement.parentElement; const buttons = container.querySelectorAll('.btn-status');
            buttons.forEach(b => { b.classList.remove('active-Ready', 'active-Presale', 'active-Kosong'); b.disabled = true; });
            btnElement.classList.add('active-' + newStatus); btnElement.innerText = '...';
            
            try {
                // Update ke Firebase Server
                await db.collection("products").doc(id).update({ status: newStatus }); 
                
                // Update ke Data Lokal agar instan
                let productIndex = localProducts.findIndex(p => p.id === id);
                if (productIndex !== -1) { localProducts[productIndex].status = newStatus; }

                showToast(`✅ Status Tersimpan`); 
                
                // RENDER ULANG TAPI PERTAHANKAN POSISI SCROLL (ANTI-LOMPAT)
                let scrollPosition = window.scrollY;
                renderStock(); 
                window.scrollTo(0, scrollPosition);

            } catch (e) { 
                showToast(`❌ Gagal!`, true); 
                buttons.forEach(b => b.disabled = false); 
            } 
        }

        async function deleteProduk(id, name) {
            if(!confirm(`YAKIN MENGHAPUS "${name}"?`)) return; 
            try { 
                await db.collection("products").doc(id).delete(); 
                showToast('✅ Dihapus!'); 
                
                // Hapus dari data lokal dan update tanpa melompat
                localProducts = localProducts.filter(p => p.id !== id);
                let scrollPosition = window.scrollY;
                renderStock(); 
                window.scrollTo(0, scrollPosition);
            } 
            catch (error) { showToast('Gagal hapus.', true); }
        }

        // ==========================================
        // FITUR MODAL EDIT DAN KONTROL GAMBAR
        // ==========================================
        function openEditModal(id, name, price, descEncoded, imagesEncoded) {
            currentEditId = id; 
            document.getElementById('editName').value = name; 
            document.getElementById('editPrice').value = 'Rp ' + new Intl.NumberFormat('id-ID').format(price);
            document.getElementById('editDesc').value = decodeURIComponent(descEncoded);
            document.getElementById('editImageFiles').value = ''; 

            let rawImages = decodeURIComponent(imagesEncoded);
            currentEditingImages = rawImages ? rawImages.split('|').map(u => u.trim()).filter(u => u !== '') : [];

            renderImagePreviews();
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function renderImagePreviews() {
            const previewContainer = document.getElementById('edit-image-preview');
            previewContainer.innerHTML = '';

            if (currentEditingImages.length === 0) {
                previewContainer.innerHTML = '<span style="font-size: 12px; color: #999;">Tidak ada foto. Harap tambah foto baru.</span>';
                return;
            }

            currentEditingImages.forEach((url, index) => {
                let thumbUrl = `https://drive.google.com/thumbnail?id=${url}&sz=w200`;
                previewContainer.innerHTML += `
                    <div class="preview-thumb">
                        <img src="${thumbUrl}" onerror="this.src='https://placehold.co/200x200/eeeeee/999999?text=Gagal';">
                        <button type="button" class="btn-remove-img" onclick="removeEditingImage(${index})">×</button>
                    </div>
                `;
            });
        }

        function removeEditingImage(index) {
            currentEditingImages.splice(index, 1);
            renderImagePreviews();
        }

        function closeEditModal() { 
            document.getElementById('modal-edit').style.display = 'none'; 
            currentEditId = null; 
        }

        async function submitEditProduk() {
            const editName = document.getElementById('editName').value; 
            const editPrice = document.getElementById('editPrice').value.replace(/[^0-9]/g, '');
            const editDesc = document.getElementById('editDesc').value; 
            const fileInput = document.getElementById('editImageFiles');
            const btn = document.getElementById('btn-submit-edit'); 
            
            if (!editName || !editPrice || !editDesc) { alert("Data teks wajib diisi!"); return; }
            if (currentEditingImages.length === 0 && fileInput.files.length === 0) { 
                alert("Produk harus memiliki minimal 1 foto!"); return; 
            }

            btn.innerText = 'Menyimpan... ⏳'; btn.disabled = true;
            try {
                let newUploadedUrls = [];
                if (fileInput.files.length > 0) {
                    btn.innerText = 'Mengupload Foto Baru... ⏳';
                    newUploadedUrls = await Promise.all(Array.from(fileInput.files).map(f => uploadFileToDrive(f)));
                }

                let finalImages = [...currentEditingImages, ...newUploadedUrls];

                let updates = { 
                    name: editName, 
                    price: editPrice, 
                    desc: editDesc,
                    image: finalImages.join('|')
                };

                await db.collection("products").doc(currentEditId).update(updates);
                showToast('✅ Produk Berhasil Diubah!'); 
                closeEditModal(); 
                loadStock(); // Load ulang keseluruhan data setelah edit beres
            } catch (error) { 
                showToast("Gagal menyimpan perubahan", true); 
            } finally { 
                btn.innerText = 'Simpan Edit '; 
                btn.disabled = false; 
            }
        }
    </script>
</body>
</html>
