<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Elegant</title>
    
    <link rel="preconnect" href="https://script.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #f7f7f8; --bg-card: #ffffff; --text-main: #111111; --text-muted: #666666; --border: #e5e5e5; --accent: #111111; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--bg-card); padding: 35px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.02); }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 30px; background: #f0f0f0; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade 0.3s; }
        @keyframes fade { from {opacity: 0;} to {opacity: 1;} }

        .input-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(17,17,17,0.05); }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        
        .stock-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; gap: 10px;}
        .item-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .item-img-container { position: relative; width: 55px; height: 55px; border-radius: 8px; background: #eee; overflow: hidden; flex-shrink: 0;}
        .item-img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        
        .btn-group-action { display: flex; gap: 6px; }
        .btn-edit { background: #f0f0f0; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #444; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s;}
        .btn-edit:hover { background: #e5e5e5; }
        
        .btn-delete { background: #fee2e2; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #991b1b; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s;}
        .btn-delete:hover { background: #fecaca; }

        .status-controls { display: flex; flex-direction: column; gap: 4px; }
        .btn-status { padding: 6px 12px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #fff; color: #666; transition: 0.2s;}
        
        .btn-status.active-Ready { background: #dcfce7; color: #166534; border-color: #166534; }
        .btn-status.active-Presale { background: #fef08a; color: #854d0e; border-color: #854d0e; }
        .btn-status.active-Kosong { background: #fee2e2; color: #991b1b; border-color: #991b1b; }

        .skeleton-img { background: #e5e5e5; position: relative; overflow: hidden; }
        .skeleton-text { background: #e5e5e5; border-radius: 4px; position: relative; overflow: hidden; }
        .shimmer::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0)); animation: shimmer 1.5s infinite; }
        
        #toast { visibility: hidden; min-width: 250px; background: #111; color: #fff; text-align: center; border-radius: 8px; padding: 14px; position: fixed; bottom: 40px; transform: translateX(-50%); left: 50%; z-index: 1000;}
        #toast.show { visibility: visible; }
        
        .modal-edit { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px;}
        .modal-edit-box { background: #fff; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;}
        .modal-edit-box h3 { margin-bottom: 20px; font-size: 18px; }
        .modal-edit-box .input-group { margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px;}
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;}
        .btn-cancel { background: #f0f0f0; color: #333; }
        .btn-update { background: #111; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Katalog Manajemen</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upload')">Tambah Produk</button>
            <button class="tab-btn" onclick="switchTab('stock'); loadStock();">Kelola Stok</button>
        </div>

        <div id="tab-upload" class="tab-content active">
            <form id="formProduk">
                <div class="input-group">
                    <label>Nama Produk</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Harga</label>
                    <input type="text" id="price" required>
                </div>
                <div class="input-group">
                    <label>Foto Produk (Dapat dipilih lebih dari 1)</label>
                    <input type="file" id="imageFiles" accept="image/png, image/jpeg, image/webp" multiple required>
                </div>
                <div class="input-group">
                    <label>Deskripsi</label>
                    <textarea id="desc" rows="3" required></textarea>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Simpan Produk</button>
            </form>
        </div>

        <div id="tab-stock" class="tab-content">
            <div id="stock-list"></div>
        </div>
    </div>

    <!-- MODAL EDIT -->
    <div class="modal-edit" id="modal-edit">
        <div class="modal-edit-box">
            <h3>Edit Produk</h3>
            
            <div class="input-group">
                <label>Nama Produk</label>
                <input type="text" id="editName" required>
            </div>
            <div class="input-group">
                <label>Harga</label>
                <input type="text" id="editPrice" required>
            </div>
            <div class="input-group">
                <label>Deskripsi</label>
                <textarea id="editDesc" rows="3" required></textarea>
            </div>
            <div class="input-group">
                <label>Ganti Foto (Opsional)</label>
                <p style="font-size: 11px; color: #666; margin-top:-5px; margin-bottom:8px;">*Kosongkan jika tidak ingin mengganti foto lama.</p>
                <input type="file" id="editImageFiles" accept="image/png, image/jpeg, image/webp" multiple>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
                <button class="btn-update" id="btn-submit-edit" onclick="submitEditProduk()">Simpan Edit</button>
            </div>
        </div>
    </div>

    <div id="toast">Notifikasi</div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwiWOMfOnoa1pjnVm9UefBhlGSH0mppuip16ui1H01W1Hixd4XwJRP-vZ36fl4-iFc9vw/exec';
        let isStockLoaded = false; let currentEditId = null;

        document.getElementById('price').addEventListener('input', formatRupiahInput);
        document.getElementById('editPrice').addEventListener('input', formatRupiahInput);

        function formatRupiahInput(e) {
            let value = this.value.replace(/[^0-9]/g, ''); 
            if (value) { this.value = 'Rp ' + new Intl.NumberFormat('id-ID').format(value); } 
            else { this.value = ''; }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active'); event.target.classList.add('active');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById("toast"); toast.innerText = msg; 
            toast.style.background = isError ? "#dc2626" : "#111"; toast.className = "show"; setTimeout(() => toast.className = "", 3000);
        }

        const processMedia = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX_SIZE = 2000; 
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } 
                    else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve({ filename: file.name, mimeType: 'image/jpeg', base64: canvas.toDataURL('image/jpeg', 0.85).split(',')[1] });
                };
            };
        });

        // FUNGSI HAPUS
        async function deleteProduk(id, name) {
            if(!confirm(`YAKIN INGIN MENGHAPUS "${name}"?\nData dan foto di Google Drive akan terhapus permanen.`)) return;

            showToast("Sedang menghapus data...");
            try {
                const payload = { action: 'delete_product', id: id };
                await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                showToast('✅ Produk berhasil dihapus!');
                isStockLoaded = false; 
                loadStock(); 
            } catch (error) { 
                showToast('Gagal menghapus produk.', true); 
            }
        }

        function openEditModal(id, name, price, descEncoded) {
            currentEditId = id; 
            document.getElementById('editName').value = name;
            document.getElementById('editPrice').value = 'Rp ' + new Intl.NumberFormat('id-ID').format(price);
            document.getElementById('editDesc').value = decodeURIComponent(descEncoded);
            document.getElementById('editImageFiles').value = ''; 
            document.getElementById('modal-edit').style.display = 'flex';
        }
        
        function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; currentEditId = null; }

        async function submitEditProduk() {
            const editName = document.getElementById('editName').value;
            const editPrice = document.getElementById('editPrice').value.replace(/[^0-9]/g, '');
            const editDesc = document.getElementById('editDesc').value;
            const fileInput = document.getElementById('editImageFiles');

            if(!editName || !editPrice || !editDesc) { alert("Data teks tidak boleh kosong!"); return; }

            const btn = document.getElementById('btn-submit-edit'); 
            btn.innerText = 'Menyimpan... ⏳'; btn.disabled = true;

            try {
                let mediaPromises = [];
                if (fileInput.files.length > 0) {
                    mediaPromises = await Promise.all(Array.from(fileInput.files).map(f => processMedia(f)));
                }

                const payload = { action: 'edit_product', id: currentEditId, name: editName, price: editPrice, desc: editDesc, images: mediaPromises };
                await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                showToast('✅ Produk berhasil diubah!');
                closeEditModal(); 
                isStockLoaded = false; 
                loadStock(); 
            } catch (error) { showToast(error.message, true); } 
            finally { btn.innerText = 'Simpan Edit'; btn.disabled = false; }
        }

        document.getElementById('formProduk').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit'); btn.innerText = 'Mengupload Kualitas HD... ⏳'; btn.disabled = true;

            try {
                const rawPrice = document.getElementById('price').value.replace(/[^0-9]/g, '');
                const fileInput = document.getElementById('imageFiles');
                let mediaPromises = await Promise.all(Array.from(fileInput.files).map(f => processMedia(f)));
                const payload = { action: 'create', name: document.getElementById('name').value, price: rawPrice, desc: document.getElementById('desc').value, images: mediaPromises };
                
                await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                showToast('Produk berhasil ditambahkan!');
                document.getElementById('formProduk').reset(); isStockLoaded = false; 
            } catch (error) { showToast(error.message, true); } 
            finally { btn.innerText = 'Simpan Produk'; btn.disabled = false; }
        });

        function renderSkeletonAdmin() {
            const list = document.getElementById('stock-list');
            list.innerHTML = '';
            for(let i=0; i<4; i++) {
                list.innerHTML += `
                    <div class="stock-item">
                        <div class="item-info">
                            <div class="skeleton-img shimmer" style="width: 55px; height: 55px; border-radius: 8px; flex-shrink: 0;"></div>
                            <div style="flex: 1;">
                                <div class="skeleton-text shimmer" style="height: 14px; width: 80%; margin-bottom: 6px;"></div>
                                <div class="skeleton-text shimmer" style="height: 12px; width: 40%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        async function loadStock() {
            if (isStockLoaded) return; 
            renderSkeletonAdmin();
            
            try {
                const res = await fetch(`${API_URL}?action=list_stock&t=${new Date().getTime()}`);
                const data = await res.json(); 
                const list = document.getElementById('stock-list');
                list.innerHTML = '';
                
                if(data.length === 0) return list.innerHTML = '<p style="text-align:center;">Belum ada produk.</p>';

                data.reverse().forEach(p => {
                    let status = p.status || 'Ready'; 
                    let fileIds = p.image ? p.image.split('|') : [];
                    let fileId = fileIds[0] || '';
                    let thumbUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w200` : '';
                    
                    list.innerHTML += `
                        <div class="stock-item">
                            <div class="item-info">
                                <div class="item-img-container"><img src="${thumbUrl}" class="item-img" loading="lazy"></div>
                                <div>
                                    <div class="item-title">${p.name}</div>
                                    <div class="btn-group-action">
                                        <button class="btn-edit" onclick="openEditModal('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.price}', '${encodeURIComponent(p.desc)}')">✏️ Edit</button>
                                        <button class="btn-delete" onclick="deleteProduk('${p.id}', '${p.name.replace(/'/g, "\\'")}')">🗑️ Hapus</button>
                                    </div>
                                </div>
                            </div>
                            <div class="status-controls">
                                <button class="btn-status ${status === 'Ready' ? 'active-Ready' : ''}" onclick="updateStock('${p.id}', 'Ready', this)">Ready</button>
                                <button class="btn-status ${status === 'Presale' ? 'active-Presale' : ''}" onclick="updateStock('${p.id}', 'Presale', this)">Presale</button>
                                <button class="btn-status ${status === 'Kosong' ? 'active-Kosong' : ''}" onclick="updateStock('${p.id}', 'Kosong', this)">Habis</button>
                            </div>
                        </div>
                    `;
                });
                isStockLoaded = true;
            } catch (e) { document.getElementById('stock-list').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>'; }
        }

        async function updateStock(id, newStatus, btnElement) {
            const container = btnElement.parentElement;
            const buttons = container.querySelectorAll('.btn-status');
            let oldStatus = 'Ready';
            buttons.forEach(b => { if(b.classList.contains('active-Ready')) oldStatus = 'Ready'; if(b.classList.contains('active-Presale')) oldStatus = 'Presale'; if(b.classList.contains('active-Kosong')) oldStatus = 'Kosong'; });
            buttons.forEach(b => { b.classList.remove('active-Ready', 'active-Presale', 'active-Kosong'); b.disabled = true; });
            btnElement.classList.add('active-' + newStatus); btnElement.innerText = '...';

            try {
                await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'update_status', id: id, status: newStatus }) });
                showToast(`✅ Status tersimpan: ${newStatus}`);
            } catch (e) {
                showToast(`❌ Gagal mengubah status!`, true);
                buttons.forEach(b => b.classList.remove('active-' + newStatus));
                const oldBtn = Array.from(buttons).find(b => b.getAttribute('onclick').includes(oldStatus));
                if(oldBtn) oldBtn.classList.add('active-' + oldStatus);
            } finally {
                buttons.forEach(b => b.disabled = false); btnElement.innerText = newStatus === 'Kosong' ? 'Habis' : newStatus;
            }
        }
    </script>
</body>
</html>
